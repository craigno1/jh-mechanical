[build]
  command = "pnpm --filter @workspace/jh-mechanical run build"
  publish = "artifacts/jh-mechanical/dist/public"

[build.environment]
  NODE_VERSION = "24"
  BASE_PATH = "/"
  PORT = "8888"

# Public pages are pre-rendered to their own directory/index.html.
# Do not add a wildcard homepage rewrite: Netlify serves 404.html for
# unknown paths, keeping genuine HTTP 404s and route-specific SEO intact.